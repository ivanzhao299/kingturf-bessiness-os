name: kingturf-business-os

services:
  postgres:
    image: postgres:17.7-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kingturf_dev}
      POSTGRES_USER: ${POSTGRES_USER:-kingturf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    command: ['postgres', '-c', 'timezone=UTC']

volumes:
  postgres_data:
