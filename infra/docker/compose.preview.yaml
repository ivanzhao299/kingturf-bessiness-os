name: kingturf-preview

services:
  postgres:
    image: postgres:17.7-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    command: ['postgres', '-c', 'timezone=UTC']

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api-preview
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_SECONDS: 28800
      PASSWORD_SALT_BYTES: 16
      PASSWORD_KEY_LENGTH: 64
      PASSWORD_SCRYPT_COST: 16384
      PASSWORD_SCRYPT_BLOCK_SIZE: 8
      PASSWORD_SCRYPT_PARALLELIZATION: 1
      ATTACHMENT_STORAGE_ADAPTER: local
      ATTACHMENT_LOCAL_DIRECTORY: /var/lib/kingturf/attachments
    volumes:
      - attachments:/var/lib/kingturf/attachments
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web-preview
    ports:
      - '4331:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  attachments:
