server {
  server_name erp.kingturf.cn;

  access_log /var/log/nginx/erp.kingturf.cn.access.log;
  error_log /var/log/nginx/erp.kingturf.cn.error.log;

  # D1 S3: observation only. Changing off to on requires a separately approved rollout.
  # This host switch is independent of the API container's CSP_ENFORCE environment.
  set $kingturf_csp_enforce off;
  set $kingturf_csp_policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'";
  set $kingturf_csp_enforced "";
  if ($kingturf_csp_enforce = on) {
    set $kingturf_csp_enforced $kingturf_csp_policy;
  }

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    proxy_pass http://127.0.0.1:4332;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # One authoritative policy at this outer proxy, including HTML/assets/API responses.
    # Inner nginx Cache-Control add_header scopes do not suppress these outer headers.
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy-Report-Only $kingturf_csp_policy always;
    add_header Content-Security-Policy $kingturf_csp_enforced always;
  }

  listen 443 ssl;
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/erp.kingturf.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/erp.kingturf.cn/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  listen 80;
  listen [::]:80;
  server_name erp.kingturf.cn;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
