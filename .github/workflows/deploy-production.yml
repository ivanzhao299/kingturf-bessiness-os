name: Deploy KingTurf Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact lowercase 40-character commit from main history (including rollback)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.guard.outputs.commit_sha }}
      control_sha: ${{ steps.guard.outputs.control_sha }}
      main_sha: ${{ steps.guard.outputs.main_sha }}
    env:
      RELEASE_SHA: ${{ inputs.commit_sha }}
      RELEASE_CONTROL_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Reject untrusted dispatch context and malformed input
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ivanzhao299/kingturf-bessiness-os
          test "$GITHUB_REF" = refs/heads/main
          [[ ${#RELEASE_SHA} -eq 40 && "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout immutable release control
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
      - name: Verify canonical origin and main history
        id: guard
        run: node scripts/validate_release.mjs

  verify:
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ needs.validate.outputs.commit_sha }}
      DATABASE_URL: postgresql://kingturf_test:ephemeral-ci-only@127.0.0.1:5432/kingturf_test
      NODE_ENV: test
    services:
      postgres:
        image: postgres:17.7-alpine3.23
        env:
          POSTGRES_DB: kingturf_test
          POSTGRES_USER: kingturf_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingturf_test -d kingturf_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm ci:local

  deploy:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    environment: production
    # Every workflow that writes this production target must share this exact group.
    concurrency:
      group: kingturf-erp-production
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ needs.validate.outputs.commit_sha }}
      RELEASE_CONTROL_SHA: ${{ needs.validate.outputs.control_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false
      - name: Verify exact deployment checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Checkout immutable release control
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.control_sha }}
          path: .release-control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
      - name: Revalidate main history after acquiring production concurrency
        working-directory: .release-control
        run: node scripts/validate_release.mjs
      - name: Pin independently verified production SSH host key
        env:
          PINNED_KNOWN_HOSTS: ${{ vars.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$PINNED_KNOWN_HOSTS"
          known_hosts_file="$RUNNER_TEMP/kingturf-production-known-hosts"
          printf '%s\n' "$PINNED_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$known_hosts_file"
          host_key_name="$PROD_SSH_HOST"
          if [ "$PROD_SSH_PORT" != 22 ]; then host_key_name="[$PROD_SSH_HOST]:$PROD_SSH_PORT"; fi
          ssh-keygen -F "$host_key_name" -f "$known_hosts_file" > "$known_hosts_file.matches"
          ssh-keygen -l -f "$known_hosts_file.matches" > /dev/null
          printf 'SSH_KNOWN_HOSTS_FILE=%s\n' "$known_hosts_file" >> "$GITHUB_ENV"
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      - name: Read-only production storage and candidate schema preflight
        env:
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PROD_DEPLOY_PATH" = /data/kingturf-erp
          manifest=$(python3 .release-control/scripts/production_preflight.py --manifest packages/database/migrations)
          cat .release-control/scripts/production_preflight.py | ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -p '${{ secrets.PROD_SSH_PORT }}' '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}' \
            "python3 - '/data/kingturf-erp' '$manifest'"
      - name: Diagnose production public HTTPS ingress
        run: |
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -p '${{ secrets.PROD_SSH_PORT }}' '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}' \
            'set +e
             echo "== listeners =="
             sudo ss -ltnp | grep -E ":(80|443|4332)\\b" || true
             echo "== ufw =="
             sudo ufw status verbose 2>&1 || true
             echo "== nftables =="
             sudo nft list ruleset 2>&1 | grep -E "(80|443|4332|drop|reject)" | head -80 || true
             echo "== nginx syntax =="
             sudo nginx -t 2>&1 || true
             echo "== nginx ingress =="
             sudo nginx -T 2>/dev/null | grep -E "(server_name erp\\.kingturf\\.cn|listen .*443|proxy_pass|ssl_certificate)" | head -80 || true
             echo "== certificate =="
             sudo openssl x509 -in /etc/letsencrypt/live/erp.kingturf.cn/fullchain.pem -noout -subject -issuer -dates 2>&1 || true
             echo "== local HTTPS =="
             curl -k -sS -D - --connect-timeout 8 --max-time 15 https://127.0.0.1/health -H "Host: erp.kingturf.cn" 2>&1 || true
             echo "== local HTTP =="
             curl -sS -D - --connect-timeout 8 --max-time 15 http://127.0.0.1/health -H "Host: erp.kingturf.cn" 2>&1 || true'
      - name: Create production recovery point
        run: |
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -p '${{ secrets.PROD_SSH_PORT }}' '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}' \
            "sh -s -- '${{ secrets.PROD_DEPLOY_PATH }}' '$RELEASE_SHA'" <<'REMOTE'
          set -eu
          cd "$1"
          candidate_sha=$2
          mkdir -p .release-backups
          previous_sha=$(cat .release-sha 2>/dev/null || printf unknown)
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          backup_prefix=".release-backups/${timestamp}-before-${candidate_sha}"
          export KINGTURF_RELEASE_SHA="$previous_sha"
          export KINGTURF_RELEASE_BUILT_AT="recovery-point-${timestamp}"
          docker compose --env-file .env.production -f infra/docker/compose.production.yaml exec -T postgres sh -c 'pg_dump --format=custom --username="$POSTGRES_USER" "$POSTGRES_DB"' > "${backup_prefix}.dump"
          test -s "${backup_prefix}.dump"
          printf 'previous_sha=%s\ncandidate_sha=%s\ncreated_at=%s\n' "$previous_sha" "$candidate_sha" "$timestamp" > "${backup_prefix}.metadata"
          # Retention runs only after the candidate passes every required probe.
          REMOTE
      - name: Synchronize configured website ingest secret
        env:
          WEBSITE_LEAD_INGEST_SECRET: ${{ secrets.WEBSITE_LEAD_INGEST_SECRET }}
        run: |
          test -n "$WEBSITE_LEAD_INGEST_SECRET"
          printf '%s' "$WEBSITE_LEAD_INGEST_SECRET" | ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -p '${{ secrets.PROD_SSH_PORT }}' '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}' \
            "python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]); key=\"WEBSITE_LEAD_INGEST_SECRET\"; value=sys.stdin.read(); lines=[line for line in p.read_text().splitlines() if not line.startswith(key+\"=\")]; p.write_text(\"\\n\".join(lines+[key+\"=\"+value])+\"\\n\")' '${{ secrets.PROD_DEPLOY_PATH }}/.env.production'"
      - name: Sync isolated KingTurf release
        run: |
          rsync -az --delete --exclude '.git/' --exclude '.release-control/' --exclude '.env.production' --exclude '.release-sha' --exclude '.release-backups/' --exclude 'kingturf_postgres_data/' --exclude 'kingturf_attachments/' \
            -e "ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_KNOWN_HOSTS_FILE -p ${{ secrets.PROD_SSH_PORT }} -o ServerAliveInterval=30 -o ConnectTimeout=30" \
            ./ '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/'
      - name: Install and reload production Nginx ingress
        run: |
          scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -P '${{ secrets.PROD_SSH_PORT }}' \
            -o ServerAliveInterval=30 -o ConnectTimeout=30 \
            infra/nginx/erp.kingturf.cn.conf \
            '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/tmp/kingturf-erp-nginx.conf'
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -p '${{ secrets.PROD_SSH_PORT }}' '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}' \
            "set -eu; sudo install -o root -g root -m 0644 /tmp/kingturf-erp-nginx.conf /etc/nginx/conf.d/erp.kingturf.cn.conf; rm -f /tmp/kingturf-erp-nginx.conf; sudo nginx -t; sudo systemctl reload nginx"
      - name: Deploy and verify
        run: |
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -p '${{ secrets.PROD_SSH_PORT }}' '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}' \
            "cd '${{ secrets.PROD_DEPLOY_PATH }}' && export KINGTURF_RELEASE_SHA='$RELEASE_SHA' KINGTURF_RELEASE_BUILT_AT='${{ github.run_id }}' && (docker compose --env-file .env.production -f infra/docker/compose.production.yaml up -d --build || (docker compose --env-file .env.production -f infra/docker/compose.production.yaml ps -a; sleep 3; docker compose --env-file .env.production -f infra/docker/compose.production.yaml up -d --build)) && sleep 15 && docker compose --env-file .env.production -f infra/docker/compose.production.yaml ps && curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 http://127.0.0.1:4332/health && curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 http://127.0.0.1:4332/ready && curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 http://127.0.0.1:4332/version | grep -F '$RELEASE_SHA' && curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 --resolve erp.kingturf.cn:443:127.0.0.1 https://erp.kingturf.cn/health && curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 --resolve erp.kingturf.cn:443:127.0.0.1 https://erp.kingturf.cn/ready && curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 --resolve erp.kingturf.cn:443:127.0.0.1 https://erp.kingturf.cn/version | grep -F '$RELEASE_SHA'"
      - name: Required production hostname HTTPS probe
        run: |
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -p '${{ secrets.PROD_SSH_PORT }}' '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}' \
            "set -eu; curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 https://erp.kingturf.cn/health | grep '\"status\":\"ok\"'; curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 https://erp.kingturf.cn/ready | grep '\"status\":\"ready\"'; curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 https://erp.kingturf.cn/version | grep -F '$RELEASE_SHA'"
      - name: Record verified production release
        run: |
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -p '${{ secrets.PROD_SSH_PORT }}' '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}' \
            "sh -s -- '${{ secrets.PROD_DEPLOY_PATH }}' '$RELEASE_SHA' '${{ github.run_id }}-${{ github.run_attempt }}'" <<'REMOTE'
          set -eu
          cd "$1"
          candidate_sha=$2
          marker=".release-sha.$3.tmp"
          trap 'rm -f "$marker"' EXIT
          curl --fail --silent --show-error http://127.0.0.1:4332/version |
            python3 -c 'import json,sys; assert json.load(sys.stdin)["sha"] == sys.argv[1]' "$candidate_sha"
          printf '%s' "$candidate_sha" > "$marker"
          mv -- "$marker" .release-sha
          REMOTE
      - name: Retain latest KingTurf recovery point and active images
        shell: bash
        run: |
          set -euo pipefail
          test -f .release-control/scripts/cleanup_kingturf_release_artifacts.sh
          test -r .release-control/scripts/cleanup_kingturf_release_artifacts.sh
          {
            cat .release-control/scripts/cleanup_kingturf_release_artifacts.sh || exit 1
            cat <<'PROBES'
          curl --fail --silent --show-error http://127.0.0.1:4332/health | grep '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:4332/ready | grep '"status":"ready"'
          curl --fail --silent --show-error http://127.0.0.1:4332/version |
            python3 -c 'import json,sys; assert json.load(sys.stdin)["sha"] == sys.argv[1]' "$KINGTURF_RELEASE_SHA"
          PROBES
          } | ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -p '${{ secrets.PROD_SSH_PORT }}' '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}' \
            "KINGTURF_RELEASE_SHA='$RELEASE_SHA' sh -se -- '${{ secrets.PROD_DEPLOY_PATH }}' kingturf-erp-production"
      - name: Diagnostic cross-border HTTPS probe from GitHub runner
        continue-on-error: true
        run: |
          python3 scripts/verify_public_https.py --host erp.kingturf.cn --path /health --expected '{"status":"ok"}'
          python3 scripts/verify_public_https.py --host erp.kingturf.cn --path /ready --expected '{"status":"ready"}'
