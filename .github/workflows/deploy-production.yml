name: Deploy KingTurf Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact 40-character KingTurf commit to deploy'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kingturf_ci
          POSTGRES_USER: kingturf_ci
          POSTGRES_PASSWORD: kingturf_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingturf_ci -d kingturf_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://kingturf_ci:kingturf_ci_password@127.0.0.1:5432/kingturf_ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      - name: Trust production host
        run: ssh-keyscan -p '${{ secrets.PROD_SSH_PORT }}' -H '${{ secrets.PROD_SSH_HOST }}' >> ~/.ssh/known_hosts
      - name: Diagnose production public HTTPS ingress
        run: |
          ssh -p '${{ secrets.PROD_SSH_PORT }}' '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}' \
            'set +e
             echo "== listeners =="
             sudo ss -ltnp | grep -E ":(80|443|4332)\\b" || true
             echo "== ufw =="
             sudo ufw status verbose 2>&1 || true
             echo "== nftables =="
             sudo nft list ruleset 2>&1 | grep -E "(80|443|4332|drop|reject)" | head -80 || true
             echo "== nginx syntax =="
             sudo nginx -t 2>&1 || true
             echo "== nginx ingress =="
             sudo nginx -T 2>/dev/null | grep -E "(server_name erp\\.kingturf\\.cn|listen .*443|proxy_pass|ssl_certificate)" | head -80 || true
             echo "== certificate =="
             sudo openssl x509 -in /etc/letsencrypt/live/erp.kingturf.cn/fullchain.pem -noout -subject -issuer -dates 2>&1 || true
             echo "== local HTTPS =="
             curl -k -sS -D - --connect-timeout 8 --max-time 15 https://127.0.0.1/health -H "Host: erp.kingturf.cn" 2>&1 || true
             echo "== local HTTP =="
             curl -sS -D - --connect-timeout 8 --max-time 15 http://127.0.0.1/health -H "Host: erp.kingturf.cn" 2>&1 || true'
      - name: Create production recovery point
        run: |
          ssh -p '${{ secrets.PROD_SSH_PORT }}' '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}' \
            "set -eu
             cd '${{ secrets.PROD_DEPLOY_PATH }}'
             mkdir -p .release-backups
             previous_sha=\$(cat .release-sha 2>/dev/null || printf unknown)
             timestamp=\$(date -u +%Y%m%dT%H%M%SZ)
             backup_prefix=.release-backups/\${timestamp}-before-${{ inputs.commit_sha }}
             export KINGTURF_RELEASE_SHA="\${previous_sha}"
             export KINGTURF_RELEASE_BUILT_AT="recovery-point-\${timestamp}"
             docker compose --env-file .env.production -f infra/docker/compose.production.yaml exec -T postgres sh -c 'pg_dump --format=custom --username=\"\$POSTGRES_USER\" \"\$POSTGRES_DB\"' > \"\${backup_prefix}.dump\"
             test -s \"\${backup_prefix}.dump\"
             printf 'previous_sha=%s\\ncandidate_sha=%s\\ncreated_at=%s\\n' \"\${previous_sha}\" '${{ inputs.commit_sha }}' \"\${timestamp}\" > \"\${backup_prefix}.metadata\"
             find .release-backups -type f -mtime +14 -delete"
      - name: Sync isolated KingTurf release
        run: |
          rsync -az --delete --exclude '.env.production' --exclude '.release-sha' --exclude '.release-backups/' --exclude 'kingturf_postgres_data/' --exclude 'kingturf_attachments/' \
            -e "ssh -p ${{ secrets.PROD_SSH_PORT }} -o ServerAliveInterval=30 -o ConnectTimeout=30" \
            ./ '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/'
      - name: Install and reload production Nginx ingress
        run: |
          scp -P '${{ secrets.PROD_SSH_PORT }}' \
            -o ServerAliveInterval=30 -o ConnectTimeout=30 \
            infra/nginx/erp.kingturf.cn.conf \
            '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/tmp/kingturf-erp-nginx.conf'
          ssh -p '${{ secrets.PROD_SSH_PORT }}' '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}' \
            "set -eu; sudo install -o root -g root -m 0644 /tmp/kingturf-erp-nginx.conf /etc/nginx/conf.d/erp.kingturf.cn.conf; rm -f /tmp/kingturf-erp-nginx.conf; sudo nginx -t; sudo systemctl reload nginx"
      - name: Deploy and verify
        run: |
          ssh -p '${{ secrets.PROD_SSH_PORT }}' '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}' \
            "cd '${{ secrets.PROD_DEPLOY_PATH }}' && printf '%s' '${{ inputs.commit_sha }}' > .release-sha && export KINGTURF_RELEASE_SHA='${{ inputs.commit_sha }}' KINGTURF_RELEASE_BUILT_AT='${{ github.run_id }}' && (docker compose --env-file .env.production -f infra/docker/compose.production.yaml up -d --build || (docker compose --env-file .env.production -f infra/docker/compose.production.yaml ps -a; sleep 3; docker compose --env-file .env.production -f infra/docker/compose.production.yaml up -d --build)) && sleep 15 && docker compose --env-file .env.production -f infra/docker/compose.production.yaml ps && curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 http://127.0.0.1:4332/health && curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 http://127.0.0.1:4332/ready && curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 http://127.0.0.1:4332/version | grep '${{ inputs.commit_sha }}' && curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 --resolve erp.kingturf.cn:443:127.0.0.1 https://erp.kingturf.cn/health && curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 --resolve erp.kingturf.cn:443:127.0.0.1 https://erp.kingturf.cn/ready && curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 --resolve erp.kingturf.cn:443:127.0.0.1 https://erp.kingturf.cn/version | grep '${{ inputs.commit_sha }}'"
      - name: Required production hostname HTTPS probe
        run: |
          ssh -p '${{ secrets.PROD_SSH_PORT }}' '${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}' \
            "set -eu; curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 https://erp.kingturf.cn/health | grep '\"status\":\"ok\"'; curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 https://erp.kingturf.cn/ready | grep '\"status\":\"ready\"'; curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 https://erp.kingturf.cn/version | grep '${{ inputs.commit_sha }}'"
      - name: Diagnostic cross-border HTTPS probe from GitHub runner
        continue-on-error: true
        run: |
          python3 scripts/verify_public_https.py --host erp.kingturf.cn --path /health --expected '{"status":"ok"}'
          python3 scripts/verify_public_https.py --host erp.kingturf.cn --path /ready --expected '{"status":"ready"}'
