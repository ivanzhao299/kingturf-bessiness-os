name: Build and Publish Release Images

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact commit SHA to build (must be in main history)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write # A-F3c: buildx attestation keyless signing (sbom/provenance)
  attestations: write # A-F3c: push image attestations

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      api_digest: ${{ steps.digests.outputs.api_digest }}
      web_digest: ${{ steps.digests.outputs.web_digest }}
    steps:
      - name: Reject malformed input
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ivanzhao299/kingturf-bessiness-os
          [[ ${#RELEASE_SHA} -eq 40 && "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify commit is in main history
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/Dockerfile.api-preview
          push: true
          sbom: true # A-F3c: SBOM attestation
          provenance: mode=max # A-F3c: maximal provenance attestation
          tags: ghcr.io/ivanzhao299/kingturf-erp-api:${{ inputs.commit_sha }}
      - name: Build and push Web image
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/Dockerfile.web-preview
          push: true
          sbom: true # A-F3c: SBOM attestation
          provenance: mode=max # A-F3c: maximal provenance attestation
          tags: ghcr.io/ivanzhao299/kingturf-erp-web:${{ inputs.commit_sha }}
      - name: Cross-check pushed tags resolve to the emitted digests
        run: |
          set -euo pipefail
          for image in api web; do
            repo="ghcr.io/ivanzhao299/kingturf-erp-$image"
            case "$image" in api) emitted='${{ steps.api.outputs.digest }}';; web) emitted='${{ steps.web.outputs.digest }}';; esac
            test -n "$emitted"
            tag_digest="sha256:$(docker buildx imagetools inspect --raw "$repo:$RELEASE_SHA" | sha256sum | cut -d ' ' -f 1)"
            test "$tag_digest" = "$emitted" || { echo "tag digest $tag_digest != emitted $emitted for $repo" >&2; exit 1; }
          done
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
      # A-F3c: scans run after push and before digest emission. A scan failure
      # (exit 1 on HIGH,CRITICAL) does not undo the build/push, but fails the
      # run conclusion so downstream recover paths (which require a successful
      # release-images run) cannot consume unvetted images.
      - name: Scan API image for vulnerabilities (HIGH+ exit 1) # A-F3c
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ghcr.io/ivanzhao299/kingturf-erp-api@${{ steps.api.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table
          output: ${{ runner.temp }}/trivy-api.txt
      - name: Scan Web image for vulnerabilities (HIGH+ exit 1) # A-F3c
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ghcr.io/ivanzhao299/kingturf-erp-web@${{ steps.web.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table
          output: ${{ runner.temp }}/trivy-web.txt
      - name: Generate API image SBOM (CycloneDX) # A-F3c
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ghcr.io/ivanzhao299/kingturf-erp-api@${{ steps.api.outputs.digest }}
          format: cyclonedx
          output: ${{ runner.temp }}/sbom-api.json
      - name: Generate Web image SBOM (CycloneDX) # A-F3c
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ghcr.io/ivanzhao299/kingturf-erp-web@${{ steps.web.outputs.digest }}
          format: cyclonedx
          output: ${{ runner.temp }}/sbom-web.json
      - name: Publish scan and SBOM evidence to step summary # A-F3c
        if: always() # evidence survives scan failure (recorded in run conclusion)
        run: |
          set -euo pipefail
          {
            echo '## A-F3c image vulnerability scan and SBOM'
            for image in api web; do
              echo "### $image trivy (HIGH,CRITICAL)"
              echo '```'
              cat "$RUNNER_TEMP/trivy-$image.txt" || echo '(scan report missing)'
              echo '```'
              echo "### $image SBOM (CycloneDX)"
              echo '```json'
              cat "$RUNNER_TEMP/sbom-$image.json" || echo '{}'
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Emit immutable digests
        id: digests
        run: |
          set -euo pipefail
          test -n '${{ steps.api.outputs.digest }}'
          test -n '${{ steps.web.outputs.digest }}'
          {
            echo "api_digest=${{ steps.api.outputs.digest }}"
            echo "web_digest=${{ steps.web.outputs.digest }}"
          } >> "$GITHUB_OUTPUT"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Release image digests (${{ inputs.commit_sha }})
          - API: `${{ steps.api.outputs.digest }}`
          - Web: `${{ steps.web.outputs.digest }}`
          EOF
