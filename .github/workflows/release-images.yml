name: Build and Publish Release Images

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact commit SHA to build (must be in main history)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Reject malformed input
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ivanzhao299/kingturf-bessiness-os
          [[ ${#RELEASE_SHA} -eq 40 && "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api-preview
          push: true
          tags: ghcr.io/ivanzhao299/kingturf-erp-api:${{ inputs.commit_sha }}
      - name: Build and push Web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web-preview
          push: true
          tags: ghcr.io/ivanzhao299/kingturf-erp-web:${{ inputs.commit_sha }}
      - name: Emit immutable digests
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Release image digests (${{ inputs.commit_sha }})
          - API: `${{ steps.api.outputs.digest }}`
          - Web: `${{ steps.web.outputs.digest }}`
          EOF
          echo "API_DIGEST=${{ steps.api.outputs.digest }}" >> "$GITHUB_OUTPUT" || true
