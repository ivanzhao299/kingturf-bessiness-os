# A-F0'（第七次人裁 A 系列审计，A3/A4 文件项）：双生态周更依赖告警。
# 激活待仓库迁移自部署 Git / 管理员开启（当前 inert；P0-1 挂起裁定见审计总录）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      workspace-dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
